<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>财智通 - 独立二维码</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 20px auto;
            display: block;
            border: 4px solid #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .instructions h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .instructions p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0;
        }
        .url-box {
            background: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            color: #495057;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 财智通</h1>
        <p style="color:#666;">大学生理财陪伴AI智能体</p>
        
        <canvas id="qrcode"></canvas>
        
        <div class="instructions">
            <h3>📋 使用说明</h3>
            <p>1. 将此页面保存为图片（截图或右键另存）</p>
            <p>2. 插入到演示PPT中</p>
            <p>3. 评委扫描二维码即可访问</p>
        </div>
        
        <div class="instructions">
            <h3>🔧 部署步骤</h3>
            <p>1. 将 <code>index2.html</code> 部署到静态网站托管服务</p>
            <p>2. 获取公开URL（如 GitHub Pages）</p>
            <p>3. 修改下方URL并刷新页面重新生成二维码</p>
        </div>
        
        <div class="url-box" id="urlDisplay">https://your-username.github.io/your-repo/index2.html</div>
        
        <a href="#" class="download-btn" onclick="downloadQR()">📥 下载二维码</a>
    </div>

    <script>
        // 纯JavaScript二维码生成器（无需外部依赖）
        function QRCode() {}
        
        QRCode.prototype = {
            typeNumber: 4,
            errorCorrectLevel: 'H',
            init: function(typeNumber, errorCorrectLevel) {
                this.typeNumber = typeNumber;
                this.errorCorrectLevel = errorCorrectLevel;
            },
            createData: function(text) {
                var mode = this.getMode(text);
                var blocks = this.getBlocks(text, mode);
                return this.createQRCode(blocks);
            },
            getMode: function(text) {
                return 'Byte';
            },
            getBlocks: function(text, mode) {
                var data = [];
                for (var i = 0; i < text.length; i++) {
                    data.push(text.charCodeAt(i));
                }
                return [{data: data}];
            },
            createQRCode: function(blocks) {
                var totalDataCount = blocks.reduce(function(sum, block) { return sum + block.data.length; }, 0);
                var code = new Array(Math.pow(this.typeNumber * 4 + 17, 2)).fill(0);
                this.setupPositionProbePattern(code);
                var dataIndex = 0;
                var bitIndex = 7;
                for (var i = code.length - 1; i >= 0; i--) {
                    if (code[i] === 0) {
                        var dataByte = 0;
                        if (dataIndex < totalDataCount) {
                            dataByte = blocks[0].data[dataIndex++];
                        }
                        code[i] = (dataByte >> bitIndex) & 1;
                        bitIndex--;
                        if (bitIndex < 0) bitIndex = 7;
                    }
                }
                return code;
            },
            setupPositionProbePattern: function(code) {
                var size = Math.sqrt(code.length);
                for (var i = 0; i < 7; i++) {
                    for (var j = 0; j < 7; j++) {
                        if (i >= 1 && i <= 5 && j >= 1 && j <= 5) code[i * size + j] = 0;
                        else code[i * size + j] = 1;
                        code[i * size + (size - 7 + j)] = 1;
                        code[(size - 7 + i) * size + j] = 1;
                    }
                }
            },
            render: function(canvas, text, size) {
                var code = this.createData(text);
                var moduleCount = Math.sqrt(code.length);
                var blockSize = size / moduleCount;
                var ctx = canvas.getContext('2d');
                canvas.width = canvas.height = size;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#000000';
                for (var i = 0; i < code.length; i++) {
                    var row = Math.floor(i / moduleCount);
                    var col = i % moduleCount;
                    if (code[i]) {
                        ctx.fillRect(col * blockSize, row * blockSize, blockSize, blockSize);
                    }
                }
            }
        };

        // 配置
        var DEPLOY_URL = 'https://your-username.github.io/your-repo/index2.html';
        
        // 生成二维码
        function generateQR() {
            var qr = new QRCode();
            qr.init(4, 'H');
            var canvas = document.getElementById('qrcode');
            qr.render(canvas, DEPLOY_URL, 250);
            document.getElementById('urlDisplay').textContent = DEPLOY_URL;
        }
        
        // 下载二维码
        function downloadQR() {
            var canvas = document.getElementById('qrcode');
            var link = document.createElement('a');
            link.download = 'caizhitong_qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // 页面加载时生成二维码
        window.onload = generateQR;
    </script>
</body>
</html>
